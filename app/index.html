        <h1>Till: an invoice that marks itself paid, whichever chain the money lands on.</h1>
        <p>
          Create an invoice on Base and get one deposit address, the same on every chain. The payer sends USDC on Base,
          Unichain or Ethereum Sepolia. One contract on Reactive Network hears the transfer, marks the invoice paid on Base
          and sweeps the money to the seller, with no server and no bridge.
        </p>
        <p>This site needs JavaScript to show live invoices. Live on testnets, with test USDC only.</p>
