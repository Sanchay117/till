[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@reactive/=lib/reactive-lib-omni/",
]

[lint]
lint_on_build = false

[fmt]
line_length = 110
